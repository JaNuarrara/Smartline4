<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLine - Smart Roof System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'fredoka': ['"Fredoka"', 'sans-serif'] },
                    colors: {
                        'sl-blue-bg': '#1e75eb',
                        'sl-blue-light': '#3b82f6',
                        'sl-blue-dark': '#1d4ed8',
                        'sl-card-bg': '#ffffff',
                        'sl-input-border': '#60a5fa',
                        'sl-btn-inactive': '#60a5fa'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #1e75eb;
            background-image: radial-gradient(#155ec4 3px, transparent 3px);
            background-size: 40px 40px;
            font-family: 'Fredoka', sans-serif;
        }
        .custom-shadow {
            box-shadow: 0 8px 0px rgba(0, 0, 0, 0.15);
        }
        .terminal-font {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
        }
    </style>
</head>
<body class="text-gray-700 min-h-screen pb-12">

<main class="container mx-auto px-4 max-w-4xl mt-8 space-y-6">
    
    <div class="flex flex-col items-center justify-center text-center my-6 text-white relative">
        <div class="flex items-center gap-3 bg-white/10 px-8 py-4 rounded-full backdrop-blur-sm border border-white/20">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-wide drop-shadow-md">SmartLine</h1>
            <span class="text-4xl animate-bounce">🤖</span>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <div class="bg-sl-card-bg rounded-[2rem] p-8 border-4 border-white custom-shadow relative overflow-hidden flex flex-col justify-between">
            <div class="absolute -top-3 -left-3 text-3xl opacity-40">🌼</div>
            <div class="absolute -bottom-3 -right-3 text-3xl opacity-40">🌼</div>

            <div>
                <h2 class="text-2xl text-sl-blue-light font-bold mb-6 flex items-center gap-2">
                    Cloud sync
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-sl-blue-light mb-1 ml-1">Api Key</label>
                        <input type="text" id="fb-apiKey" class="w-full bg-white border-2 border-sl-input-border rounded-xl px-4 py-2.5 outline-none focus:border-sl-blue-dark transition text-gray-700 font-medium" placeholder="Enter API Key...">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-sl-blue-light mb-1 ml-1">DataBase url</label>
                        <input type="text" id="fb-dbUrl" class="w-full bg-white border-2 border-sl-input-border rounded-xl px-4 py-2.5 outline-none focus:border-sl-blue-dark transition text-gray-700 font-medium" placeholder="Enter Database URL...">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-sl-blue-light mb-1 ml-1">Node Path</label>
                        <input type="text" id="fb-path" class="w-full bg-white border-2 border-sl-input-border rounded-xl px-4 py-2.5 outline-none focus:border-sl-blue-dark transition text-gray-700 font-medium" placeholder="e.g. roof/system1">
                    </div>
                </div>
            </div>

            <button id="btn-connect-fb" class="w-full mt-6 bg-sl-blue-light hover:bg-sl-blue-dark text-white font-bold py-3 rounded-xl transition transform active:scale-95 flex items-center justify-center gap-2 shadow-md">
                <i class="ph-bold ph-cloud-arrow-up"></i> Sync with Firebase
            </button>
        </div>

        <div class="space-y-6 flex flex-col">
            
            <div class="bg-sl-card-bg rounded-[2rem] p-6 border-4 border-white custom-shadow flex-1">
                <h2 class="text-xl text-sl-blue-light font-bold mb-4">Hard ware link</h2>
                <div class="space-y-3">
                    <button id="btn-connect-ble" class="w-full bg-sl-blue-light hover:bg-sl-blue-dark text-white font-bold py-3 rounded-xl transition transform active:scale-95 flex items-center justify-center gap-2">
                        <i class="ph-bold ph-bluetooth"></i> Microbit Connect
                    </button>
                    <button id="btn-disconnect-ble" class="w-full bg-slate-400 hover:bg-slate-500 text-white font-bold py-3 rounded-xl transition transform active:scale-95 flex items-center justify-center gap-2 hidden">
                        <i class="ph-bold ph-power"></i> Microbit Disconnected
                    </button>
                </div>
                <div id="ble-status" class="mt-3 text-center text-xs font-bold text-slate-400">● Disconnected</div>
            </div>

            <div class="bg-sl-card-bg rounded-[2rem] p-6 border-4 border-white custom-shadow relative">
                <div class="absolute -top-4 right-6 bg-sky-200 text-white rounded-full p-1 text-sm border-2 border-white">☁️</div>
                
                <h2 class="text-xl text-sl-blue-light font-bold mb-4">Mode</h2>
                <div class="flex flex-col gap-3">
                    <button id="btn-auto" onclick="setMode('auto')" class="w-full bg-sl-blue-light text-white font-bold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2">
                        <i class="ph-fill ph-android-logo"></i> Outomatic
                    </button>
                    <button id="btn-manual" onclick="setMode('manual')" class="w-full bg-sl-btn-inactive text-white/80 font-bold py-3 rounded-xl transition hover:bg-sl-blue-light hover:text-white flex items-center justify-center gap-2">
                        <i class="ph-fill ph-hand-pointing"></i> Manual
                    </button>
                </div>
            </div>

        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <div class="bg-sl-card-bg rounded-[2rem] p-8 border-4 border-white custom-shadow text-center flex flex-col items-center justify-center min-h-[280px]">
            <h2 id="rain-status-text" class="text-3xl md:text-4xl font-extrabold text-sl-blue-light mb-6 tracking-tight">
                No Rain Detected
            </h2>
            <div id="rain-icon-container" class="transition-all duration-500 transform">
                <i class="ph-fill ph-sun text-amber-400 text-8xl drop-shadow"></i>
            </div>
            <div class="hidden">
                <span id="val-ultra1">0</span>
                <span id="val-ultra2">0</span>
                <input type="range" id="range-ultra1">
                <input type="range" id="range-ultra2">
                <span id="val-suhu">0</span>
            </div>
        </div>

        <div class="bg-sl-card-bg rounded-[2rem] p-8 border-4 border-white custom-shadow flex flex-col justify-between min-h-[280px]">
            <div class="text-center">
                <h2 class="text-3xl font-extrabold text-sl-blue-light mb-2 tracking-tight">roof</h2>
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-4">Pin P13 Control</p>
            </div>

            <div class="flex flex-col gap-3 items-center w-full">
                <button id="btn-roof-open" onclick="setRoofStatus(true)" class="w-full bg-sl-blue-light text-white font-bold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2 disabled:opacity-50">
                    Open
                </button>
                
                <div class="text-amber-400 text-xl my-1 animate-pulse">✦</div>

                <button id="btn-roof-close" onclick="setRoofStatus(false)" class="w-full bg-sl-btn-inactive text-white/80 font-bold py-3 rounded-xl transition hover:bg-sl-blue-light hover:text-white flex items-center justify-center gap-2 disabled:opacity-50">
                    Close
                </button>
            </div>
        </div>

    </div>

    <div class="bg-slate-900 rounded-3xl p-4 shadow-xl border-4 border-white/20 mt-6">
        <div class="flex items-center justify-between mb-2 border-b border-slate-800 pb-2">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <span class="ml-2 terminal-font text-xs text-slate-400">system_log @ smartline</span>
            </div>
            <button id="btnClearLog" class="text-red-400 hover:text-red-300 transition text-xs font-bold flex items-center gap-1">
                <i class="ph-bold ph-trash"></i> Clear
            </button>
        </div>
        <div id="terminal-content" class="terminal-font bg-slate-950 rounded-xl h-32 p-3 text-xs text-green-400 overflow-y-auto space-y-1">
            <div class="opacity-60">System initialized. Waiting for Micro:bit or Firebase connection...</div>
        </div>
    </div>

</main>

<script type="module">
import { initializeApp, getApps, deleteApp }      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, onValue, update }       from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

// BLE UUIDs (Sesuai dengan kode asli anda)
const SVC = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const TX  = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; 
const RX  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; 

// Application State
const S = {
    device: null, rxChar: null, bleBuffer: '',
    mode: 'auto',   // 'auto' | 'manual'
    relay: false,   // false = Closed / true = Open
    db: null, fbPath: ''
};

const $ = id => document.getElementById(id);

// Terminal Logger
function log(msg, color = '#34d399') {
    const term = $('terminal-content');
    const line = document.createElement('div');
    line.className = 'opacity-90 py-0.5 terminal-font';
    line.style.color = color;
    line.textContent = `[${new Date().toLocaleTimeString()}] > ${msg}`;
    term.appendChild(line);
    term.scrollTop = term.scrollHeight;
}

// BLE Bluetooth Connection
async function connectBLE() {
    try {
        log('Searching for Micro:bit device...', '#fbbf24');
        S.device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: 'BBC micro:bit' }],
            optionalServices: [SVC]
        });
        S.device.addEventListener('gattserverdisconnected', onBLEDisconnect);
        const server  = await S.device.gatt.connect();
        const service = await server.getPrimaryService(SVC);
        S.rxChar      = await service.getCharacteristic(RX);
        const txChar  = await service.getCharacteristic(TX);
        await txChar.startNotifications();
        txChar.addEventListener('characteristicvaluechanged', onBLEData);
        setBLEStatus(true);
        log(`Connected successfully: ${S.device.name} ✅`, '#34d399');
    } catch (e) {
        log('Connection failed: ' + e.message.toLowerCase(), '#f87171');
    }
}

function onBLEDisconnect() {
    setBLEStatus(false);
    log('Bluetooth connection lost.', '#f87171');
}

function setBLEStatus(connected) {
    $('btn-connect-ble').classList.toggle('hidden', connected);
    $('btn-disconnect-ble').classList.toggle('hidden', !connected);
    $('ble-status').textContent = connected ? '● Connected' : '● Disconnected';
    $('ble-status').style.color = connected ? '#34d399' : '#94a3b8';
}

// Receive Data from Micro:bit
function onBLEData(e) {
    S.bleBuffer += new TextDecoder().decode(e.target.value);
    const lines = S.bleBuffer.split('\n');
    S.bleBuffer = lines.pop() ?? '';
    lines.forEach(line => {
        line = line.trim();
        if (!line || !line.includes(':')) return;
        const idx = line.indexOf(':');
        const key = line.substring(0, idx).trim();
        const val = line.substring(idx + 1).trim();
        log(`Incoming Data → ${key}:${val}`, '#60a5fa');
        handleIncoming(key, val);
    });
}

// Processing incoming sensor & state values
function handleIncoming(key, val) {
    switch (key) {
        // Logika Jarak / Rain Sensor logic adaptasi dari kode lama anda
        case 'jarak':
        case 'jarak_manual':
            const distanceValue = parseFloat(val) || 0;
            if (key === 'jarak') $('val-ultra1').textContent = val;
            if (key === 'jarak_manual') $('val-ultra2').textContent = val;
            
            // Contoh aturan pemicu hujan (bisa disesuaikan dengan Micro:bit Anda)
            if (distanceValue >= 30) {
                $('rain-status-text').textContent = "Rain Detected";
                $('rain-icon-container').innerHTML = `<i class="ph-fill ph-cloud-rain text-sl-blue-light text-8xl drop-shadow animate-bounce"></i>`;
            } else {
                $('rain-status-text').textContent = "No Rain Detected";
                $('rain-icon-container').innerHTML = `<i class="ph-fill ph-sun text-amber-400 text-8xl drop-shadow"></i>`;
            }
            break;

        case 'suhu':
            $('val-suhu').textContent = val;
            break;

        case 'Relay':
            // Sinkronisasi status Roof/Relay dari Microbit
            applyRoofUI(val.trim() === '1');
            break;

        case 'mode':
            // 1 = Outomatic, 0 = Manual
            applyModeUI(val.trim() === '1' ? 'auto' : 'manual');
            break;
    }

    // Update to Firebase Realtime Database if connected
    if (S.db) {
        update(ref(S.db, `${S.fbPath}/${key}`), { value: parseFloat(val) || 0 }).catch(() => {});
    }
}

// Set System Mode (Outomatic / Manual)
window.setMode = function(mode) {
    sendBLE('mode', mode === 'auto' ? 1 : 0);
    log(`Mode command payload sent: mode,${mode === 'auto' ? 1 : 0}`, '#fbbf24');
    applyModeUI(mode);

    if (S.db) update(ref(S.db, `${S.fbPath}/mode`), { value: mode === 'auto' ? 1 : 0 }).catch(() => {});
};

function applyModeUI(mode) {
    S.mode = mode;
    const isAuto = mode === 'auto';
    
    const activeStyle   = 'w-full bg-sl-blue-light text-white font-bold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2';
    const inactiveStyle = 'w-full bg-sl-btn-inactive text-white/80 font-bold py-3 rounded-xl transition hover:bg-sl-blue-light hover:text-white flex items-center justify-center gap-2';
    
    $('btn-auto').className   = isAuto ? activeStyle : inactiveStyle;
    $('btn-manual').className = !isAuto ? activeStyle : inactiveStyle;
    
    // Lock/Unlock control buttons depending on selected Mode
    $('btn-roof-open').disabled = isAuto;
    $('btn-roof-close').disabled = isAuto;
    log(`UI Mode state transformed into: ${mode}`, '#34d399');
}

// Toggle or Set Roof Status (Open = Relay 1 / Close = Relay 0)
window.setRoofStatus = function(openStatus) {
    if (S.mode === 'auto') {
        log('Action denied: switch to manual mode first to control roof manually.', '#f87171');
        return;
    }
    sendBLE('Relay', openStatus ? 1 : 0);
    log(`Roof control payload sent: Relay,${openStatus ? 1 : 0}`, '#fbbf24');
    applyRoofUI(openStatus);

    if (S.db) update(ref(S.db, `${S.fbPath}/Relay`), { value: openStatus ? 1 : 0 }).catch(() => {});
};

function applyRoofUI(isOpen) {
    S.relay = isOpen;
    
    const activeStyle   = 'w-full bg-sl-blue-light text-white font-bold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2';
    const inactiveStyle = 'w-full bg-sl-btn-inactive text-white/80 font-bold py-3 rounded-xl transition hover:bg-sl-blue-light hover:text-white flex items-center justify-center gap-2';

    if (isOpen) {
        $('btn-roof-open').className = activeStyle;
        $('btn-roof-close').className = inactiveStyle;
    } else {
        $('btn-roof-open').className = inactiveStyle;
        $('btn-roof-close').className = activeStyle;
    }
}

// Send Bluetooth Data Package format string "key,value\n"
async function sendBLE(key, val) {
    if (!S.rxChar) {
        log('Error context: Micro:bit hardware is currently disconnected!', '#f87171');
        return;
    }
    const payload = `${key},${val}\n`;
    try {
        await S.rxChar.writeValue(new TextEncoder().encode(payload));
        log(`TX raw string transmitted → ${key},${val}`, '#60a5fa');
    } catch (e) {
        log('TX transmission error details: ' + e.message.toLowerCase(), '#f87171');
    }
}

// Firebase Cloud Sync Connection Setup
async function connectFirebase() {
    const apiKey = $('fb-apiKey').value.trim();
    const dbUrl  = $('fb-dbUrl').value.trim();
    const path   = $('fb-path').value.trim() || 'roof/system1';
    
    if (!apiKey || !dbUrl) { alert('Please provide valid Firebase API Key and Database URL!'); return; }
    try {
        const apps = getApps();
        if (apps.length) await deleteApp(apps[0]);
        const app = initializeApp({
            apiKey,
            databaseURL: dbUrl,
            projectId: dbUrl.replace('https://','').split('.')[0]
        });
        S.db     = getDatabase(app);
        S.fbPath = path;
        log(`Firebase Cloud Sync connected targeted path → /${path}`, '#34d399');
        
        onValue(ref(S.db, path), snap => {
            const d = snap.val();
            if (!d) return;
            ['suhu','jarak','jarak_manual','Relay','mode'].forEach(k => {
                if (d[k] !== undefined) {
                    handleIncoming(k, String(d[k]?.value ?? d[k]));
                }
            });
        }, err => log('Firebase connection error: ' + err.message, '#f87171'));
    } catch (e) {
        log('Firebase initialization error: ' + e.message, '#f87171');
    }
}

// Event Listeners Mapping
$('btn-connect-ble').onclick    = connectBLE;
$('btn-disconnect-ble').onclick = () => { if (S.device) S.device.gatt.disconnect(); };
$('btn-connect-fb').onclick     = connectFirebase;
$('btnClearLog').onclick        = () => { $('terminal-content').innerHTML = ''; };

window.onload = () => {
    applyModeUI('auto'); // Default startup condition
    log('System SmartLine Ready. Configure your sync endpoints.');
};
</script>
</body>
</html>
