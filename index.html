<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLine - Smart Roof System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'balsamiq': ['"Balsamiq Sans"', 'cursive'] },
                    colors: {
                        'sl-bg-blue': '#2575fc',
                        'sl-card-bg': '#ffffff',
                        'sl-blue-primary': '#2a7ff5',
                        'sl-blue-secondary': '#6ba3f5',
                        'sl-blue-light': '#eef5ff',
                        'sl-text-blue': '#0084ff',
                        'sl-term-bg': '#0f2c1b',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(135deg, #2575fc 0%, #1a56db 100%);
            font-family: 'Balsamiq Sans', cursive;
            min-height: 100vh;
        }
        .terminal-font {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace !important;
        }
    </style>
</head>
<body class="font-balsamiq text-gray-700 pb-12">

<!-- CONTAINER -->
<div class="container mx-auto px-4 max-w-4xl pt-8">
    
    <!-- TITLE LOGO HEADER -->
    <div class="flex flex-col items-center justify-center mb-8 relative">
        <div class="flex items-center gap-3 bg-white/10 backdrop-blur-md px-8 py-4 rounded-full border border-white/20 shadow-lg">
            <h1 class="text-4xl md:text-5xl text-white font-bold tracking-wide select-none">SmartLine</h1>
            <div class="relative bg-white p-2 rounded-2xl shadow-md w-12 h-12 flex items-center justify-center">
                <i class="ph-fill ph-robot text-3xl text-sl-blue-primary"></i>
                <span class="absolute -top-1 -right-1 flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-red-500"></span>
                </span>
            </div>
        </div>
    </div>

    <!-- MAIN GRID SECTION -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
        
        <!-- LEFT COLUMN: CLOUD SYNC -->
        <div class="bg-white rounded-[2rem] p-8 shadow-xl border-4 border-white/40 relative overflow-hidden h-full min-h-[420px] flex flex-col justify-between">
            <!-- Decorative Flower/Cloud Background Elements like Image -->
            <div class="absolute -top-4 -left-4 w-12 h-12 opacity-20 text-sl-blue-primary text-4xl">🌼</div>
            <div class="absolute -bottom-4 -right-4 w-12 h-12 opacity-20 text-sl-blue-primary text-4xl">🌼</div>
            
            <div>
                <div class="flex items-center gap-2 mb-6">
                    <i class="ph-fill ph-cloud text-sl-text-blue text-2xl"></i>
                    <h2 class="text-2xl text-sl-text-blue font-bold tracking-wide">Cloud sync</h2>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-sl-blue-secondary mb-1 ml-2">Api Key</label>
                        <input type="text" id="fb-apiKey" class="w-full bg-white border-2 border-sl-blue-secondary/30 rounded-2xl px-4 py-3 outline-none focus:border-sl-blue-primary transition text-gray-700 shadow-inner" placeholder="Enter API Key...">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-sl-blue-secondary mb-1 ml-2">DataBase url</label>
                        <input type="text" id="fb-dbUrl" class="w-full bg-white border-2 border-sl-blue-secondary/30 rounded-2xl px-4 py-3 outline-none focus:border-sl-blue-primary transition text-gray-700 shadow-inner" placeholder="Enter Database URL...">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-sl-blue-secondary mb-1 ml-2">Node Path</label>
                        <input type="text" id="fb-path" class="w-full bg-white border-2 border-sl-blue-secondary/30 rounded-2xl px-4 py-3 outline-none focus:border-sl-blue-primary transition text-gray-700 shadow-inner" placeholder="e.g. roof/system1">
                    </div>
                </div>
            </div>

            <button id="btn-connect-fb" class="w-full mt-6 bg-sl-blue-primary hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-2xl shadow-md transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2 text-lg">
                <i class="ph-bold ph-link"></i> Connect with Firebase
            </button>
        </div>

        <!-- RIGHT COLUMN: HARDWARE LINK & MODE -->
        <div class="space-y-6">
            
            <!-- HARDWARE LINK PANEL -->
            <div class="bg-white rounded-[2rem] p-6 shadow-xl border-4 border-white/40">
                <h2 class="text-xl text-sl-text-blue font-bold mb-4 tracking-wide ml-2">Hard ware link</h2>
                <div class="space-y-3">
                    <button id="btn-connect-ble" class="w-full bg-sl-blue-primary hover:bg-blue-600 text-white font-bold py-3 rounded-2xl shadow-md transition transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                        <i class="ph-bold ph-bluetooth"></i> Microbit connected
                    </button>
                    <button id="btn-disconnect-ble" class="w-full bg-sl-blue-secondary text-white font-bold py-3 rounded-2xl flex items-center justify-center gap-2 transition hover:bg-blue-400 hidden">
                        <i class="ph-bold ph-x"></i> Microbit Disconnected
                    </button>
                </div>
                <div id="ble-status" class="mt-3 text-center text-xs font-bold text-gray-400">● Disconnected</div>
            </div>

            <!-- MODE CONTROL PANEL -->
            <div class="bg-white rounded-[2rem] p-6 shadow-xl border-4 border-white/40 relative">
                <div class="absolute top-2 right-6 text-xl opacity-40">☁️</div>
                <h2 class="text-xl text-sl-text-blue font-bold mb-4 tracking-wide ml-2">Mode</h2>
                <div class="space-y-3">
                    <button id="btn-auto" onclick="setMode('auto')" class="w-full bg-sl-blue-primary text-white font-bold py-3 rounded-2xl shadow-md transition flex items-center justify-center gap-2 text-lg border-2 border-transparent">
                        <i class="ph-fill ph-robot"></i> Outomatic
                    </button>
                    <button id="btn-manual" onclick="setMode('manual')" class="w-full bg-sl-blue-secondary text-white/90 font-bold py-3 rounded-2xl hover:bg-blue-400 transition flex items-center justify-center gap-2 text-lg border-2 border-transparent">
                        <i class="ph-fill ph-hand-palm"></i> Manual
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- BOTTOM ROW GRID: RAIN DETECTED & ROOF STATUS -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
        
        <!-- RAIN DETECTED STATUS PANEL -->
        <div class="bg-white rounded-[2rem] p-8 shadow-xl border-4 border-white/40 flex flex-col items-center justify-center text-center min-h-[320px]">
            <h2 class="text-3xl md:text-4xl text-sl-text-blue font-bold mb-6 tracking-wide" id="rain-status-text">Rain detected</h2>
            
            <div class="relative p-4 bg-sl-blue-light rounded-full mb-4 animate-bounce">
                <!-- Rain Display SVG / Icon dynamically changing color -->
                <i id="rain-icon" class="ph-fill ph-cloud-rain text-sl-blue-primary text-8xl drop-shadow-md transition-colors duration-500"></i>
            </div>
            
            <!-- Hidden input slider/toggle simulate rain sensor input (useful for testing without hardware) -->
            <div class="w-full max-w-xs mt-2">
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Simulate Rain Sensor</label>
                <select id="simulate-rain" class="w-full bg-gray-50 border border-gray-200 rounded-xl py-1.5 px-3 text-sm font-bold text-gray-600 outline-none focus:border-sl-blue-primary" onchange="toggleRainSimulation(this.value)">
                    <option value="rain">Raining (Detected)</option>
                    <option value="clear" selected>Clear Sky (No Rain)</option>
                </select>
            </div>
        </div>

        <!-- ROOF STATUS PANEL (MANUAL OVERRIDE BUTTONS) -->
        <div class="bg-white rounded-[2rem] p-8 shadow-xl border-4 border-white/40 flex flex-col items-center justify-center min-h-[320px]">
            <h2 class="text-3xl md:text-4xl text-sl-text-blue font-bold mb-6 tracking-wide lowercase">roof</h2>
            
            <div class="w-full space-y-4 max-w-xs flex flex-col items-center">
                <button id="btn-roof-open" onclick="controlRoof(true)" class="w-full bg-sl-blue-primary text-white font-bold py-3.5 rounded-2xl shadow-md transition text-xl disabled:opacity-50 disabled:cursor-not-allowed">
                    Open
                </button>
                
                <!-- Center Diamond Accent from reference image -->
                <div class="text-yellow-400 text-2xl my-1 animate-pulse">✦</div>
                
                <button id="btn-roof-close" onclick="controlRoof(false)" class="w-full bg-sl-blue-secondary text-white font-bold py-3.5 rounded-2xl shadow-md transition text-xl disabled:opacity-50 disabled:cursor-not-allowed">
                    Close
                </button>
            </div>
        </div>

    </div>

    <!-- RE-IMPLEMENTED SYSTEM LOG TERMINAL FROM ORIGINAL -->
    <div class="bg-sl-term-bg rounded-3xl p-4 shadow-2xl border-2 border-[#1a4a2d] mt-8">
        <div class="flex items-center justify-between mb-3 border-b border-[#1a4a2d] pb-3">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-[#ff5f56]"></div>
                <div class="w-3 h-3 rounded-full bg-[#ffbd2e]"></div>
                <div class="w-3 h-3 rounded-full bg-[#27c93f]"></div>
                <span class="ml-4 terminal-font text-xs text-[#ff5f56] font-bold tracking-wider lowercase">system_terminal – smartline_roof</span>
            </div>
            <button id="btnClearLog" class="border border-[#ff5f56] text-[#ff5f56] hover:bg-[#ff5f56] hover:text-white transition rounded-full px-4 py-1 text-xs font-bold flex items-center gap-1">
                <i class="ph-bold ph-trash"></i> Clear
            </button>
        </div>
        <div id="terminal-content" class="terminal-font bg-[#050f09] rounded-2xl h-36 p-4 text-[11px] text-[#27c93f] overflow-y-auto">
            <div class="opacity-70">welcome to smartline roof system terminal...</div>
            <div class="opacity-70">waiting for micro:bit connection...</div>
        </div>
    </div>

</div>

<!-- JAVASCRIPT STATE AND LOGIC PRESERVING ALL FUNCTIONALITIES -->
<script type="module">
import { initializeApp, getApps, deleteApp }      from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, onValue, update, set } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

// ── BLE UUIDs ──
const SVC = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const TX  = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // micro:bit → web
const RX  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // web → micro:bit

// ── Application State ──
const S = {
    device: null, rxChar: null, bleBuffer: '',
    mode: 'auto',      // 'auto' | 'manual'
    roofOpen: true,    // true = open, false = close (maps to relay logic)
    rainDetected: false, 
    db: null, fbPath: ''
};

const $ = id => document.getElementById(id);

// ── Terminal Logger ──
function log(msg, color = '#27c93f') {
    const term = $('terminal-content');
    if (!term) return;
    const line = document.createElement('div');
    line.className  = 'opacity-90 py-0.5 terminal-font';
    line.style.color = color;
    line.textContent = `[${new Date().toLocaleTimeString()}] > ${msg}`;
    term.appendChild(line);
    term.scrollTop = term.scrollHeight;
}

// ── Bluetooth Connection ──
async function connectBLE() {
    try {
        log('searching for micro:bit...', '#ffbd2e');
        S.device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: 'BBC micro:bit' }],
            optionalServices: [SVC]
        });
        S.device.addEventListener('gattserverdisconnected', onBLEDisconnect);
        const server  = await S.device.gatt.connect();
        const service = await server.getPrimaryService(SVC);
        S.rxChar      = await service.getCharacteristic(RX);
        const txChar  = await service.getCharacteristic(TX);
        await txChar.startNotifications();
        txChar.addEventListener('characteristicvaluechanged', onBLEData);
        setBLEStatus(true);
        log(`connected: ${S.device.name} ✅`, '#27c93f');
    } catch (e) {
        log('connection failed: ' + e.message.toLowerCase(), '#ff5f56');
    }
}

function onBLEDisconnect() {
    setBLEStatus(false);
    log('bluetooth connection lost.', '#ff5f56');
}

function setBLEStatus(ok) {
    $('btn-connect-ble').classList.toggle('hidden', ok);
    $('btn-disconnect-ble').classList.toggle('hidden', !ok);
    $('ble-status').textContent = ok ? '● Connected' : '● Disconnected';
    $('ble-status').style.color = ok ? '#27c93f' : '#aaa';
}

// ── Data Processing ──
function onBLEData(e) {
    S.bleBuffer += new TextDecoder().decode(e.target.value);
    const lines = S.bleBuffer.split('
');
    S.bleBuffer = lines.pop() ?? '';
    lines.forEach(line => {
        line = line.trim();
        if (!line || !line.includes(':')) return;
        const idx = line.indexOf(':');
        const key = line.substring(0, idx).trim();
        const val = line.substring(idx + 1).trim();
        log(`rx ← ${key}:${val}`, '#a8ff78');
        handleIncoming(key, val);
    });
}

// ── Incoming Key / Value Handler ──
function handleIncoming(key, val) {
    switch (key) {
        case 'rain':
            // 1 = rain detected, 0 = clear
            const isRaining = val.trim() === '1';
            S.rainDetected = isRaining;
            applyRainUI(isRaining);
            
            // Logic requirement: If outomatic mode and rain detected -> close roof. If clear -> open roof.
            if (S.mode === 'auto') {
                if (isRaining) {
                    log('auto mode: rain detected -> closing roof.', '#ffbd2e');
                    applyRoofUI(false);
                } else {
                    log('auto mode: clear sky -> opening roof.', '#ffbd2e');
                    applyRoofUI(true);
                }
            }
            break;

        case 'Relay':
            // Preserving Relay key but mapping it internally to Roof status display
            // 1 = Relay active (Roof Closed), 0 = Relay inactive (Roof Open)
            applyRoofUI(val.trim() === '0'); 
            break;

        case 'mode':
            // 1 = automatic, 0 = manual
            applyModeUI(val.trim() === '1' ? 'auto' : 'manual');
            break;
    }

    // Firebase Sync Engine
    if (S.db) {
        update(ref(S.db, `${S.fbPath}/${key}`), { value: parseFloat(val) || 0 })
            .catch(() => {});
    }
}

// ── Rain Simulation Trigger ──
window.toggleRainSimulation = function(val) {
    const sensorValue = (val === 'rain') ? '1' : '0';
    log(`simulating rain sensor input value: ${sensorValue}`, '#ffbd2e');
    handleIncoming('rain', sensorValue);
};

function applyRainUI(isRaining) {
    const textEl = $('rain-status-text');
    const iconEl = $('rain-icon');
    
    if (isRaining) {
        textEl.textContent = "Rain detected";
        iconEl.className = "ph-fill ph-cloud-rain text-sl-blue-primary text-8xl drop-shadow-md transition-colors duration-500";
    } else {
        textEl.textContent = "No Rain / Clear";
        iconEl.className = "ph-fill ph-sun text-yellow-400 text-8xl drop-shadow-md transition-colors duration-500";
    }
}

// ── Mode Engine ──
window.setMode = function(mode) {
    sendBLE('mode', mode === 'auto' ? 1 : 0);
    log(`mode command → ${mode} (sent: mode,${mode === 'auto' ? 1 : 0})`, '#ffbd2e');

    applyModeUI(mode);

    if (S.db) update(ref(S.db, `${S.fbPath}/mode`), { value: mode === 'auto' ? 1 : 0 }).catch(() => {});
};

function applyModeUI(mode) {
    S.mode = mode;
    const isAuto = mode === 'auto';
    
    const activeClass = "w-full bg-sl-blue-primary text-white font-bold py-3 rounded-2xl shadow-md transition flex items-center justify-center gap-2 text-lg border-2 border-transparent";
    const inactiveClass = "w-full bg-sl-blue-secondary text-white/90 font-bold py-3 rounded-2xl hover:bg-blue-400 transition flex items-center justify-center gap-2 text-lg border-2 border-transparent opacity-60";
    
    $('btn-auto').className = isAuto ? activeClass : inactiveClass;
    $('btn-manual').className = !isAuto ? activeClass : inactiveClass;
    
    // Disable manual controls when in Automatic mode
    $('btn-roof-open').disabled = isAuto;
    $('btn-roof-close').disabled = isAuto;
    
    log(`mode ui updated → ${mode}`, '#aaffaa');
    
    // If switched back to auto, run immediate check based on rain status
    if (isAuto) {
        if (S.rainDetected) {
            applyRoofUI(false);
        } else {
            applyRoofUI(true);
        }
    }
}

// ── Roof Control Engine (Replacing Relay Toggle) ──
window.controlRoof = function(openTarget) {
    if (S.mode === 'auto') {
        log('cannot control roof manually in auto mode.', '#ff5f56');
        return;
    }
    
    // Mapping roof Open/Close state to the original Relay output syntax logic:
    // Open = Relay 0, Close = Relay 1
    const relayValue = openTarget ? 0 : 1;
    sendBLE('Relay', relayValue);
    log(`roof manual command → ${openTarget ? 'open' : 'close'} (sent: Relay,${relayValue})`, '#ffbd2e');

    applyRoofUI(openTarget);

    if (S.db) update(ref(S.db, `${S.fbPath}/Relay`), { value: relayValue }).catch(() => {});
};

function applyRoofUI(isOpen) {
    S.roofOpen = isOpen;
    const btnOpen = $('btn-roof-open');
    const btnClose = $('btn-roof-close');
    
    const activeBtn = "w-full bg-sl-blue-primary text-white font-bold py-3.5 rounded-2xl shadow-md transition text-xl border-2 border-blue-300 scale-105";
    const inactiveBtn = "w-full bg-sl-blue-secondary text-white font-bold py-3.5 rounded-2xl shadow-md transition text-xl opacity-60 scale-100";
    
    if (isOpen) {
        btnOpen.className = activeBtn;
        btnClose.className = inactiveBtn;
        log('roof status ui updated -> OPEN', '#aaffaa');
    } else {
        btnOpen.className = inactiveBtn;
        btnClose.className = activeBtn;
        log('roof status ui updated -> CLOSED', '#aaffaa');
    }
}

// ── Firebase Connection ──
async function connectFirebase() {
    const apiKey = $('fb-apiKey').value.trim();
    const dbUrl  = $('fb-dbUrl').value.trim();
    const path   = $('fb-path').value.trim() || 'roof/system1';
    if (!apiKey || !dbUrl) { alert('Please fill in API Key and Database URL!'); return; }
    try {
        const apps = getApps();
        if (apps.length) await deleteApp(apps[0]);
        const app = initializeApp({
            apiKey,
            databaseURL: dbUrl,
            projectId: dbUrl.replace('https://','').split('.')[0]
        });
        S.db     = getDatabase(app);
        S.fbPath = path;
        log(`firebase connected → /${path}`, '#27c93f');
        onValue(ref(S.db, path), snap => {
            const d = snap.val();
            if (!d) return;
            ['rain','Relay','mode'].forEach(k => {
                if (d[k] !== undefined) {
                    handleIncoming(k, String(d[k]?.value ?? d[k]));
                }
            });
        }, err => log('firebase error: ' + err.message, '#ff5f56'));
    } catch (e) {
        log('firebase error: ' + e.message, '#ff5f56');
    }
}

// ── Event Initialization ──
$('btn-connect-ble').onclick    = connectBLE;
$('btn-disconnect-ble').onclick = () => { if (S.device) S.device.gatt.disconnect(); };
$('btn-connect-fb').onclick     = connectFirebase;
$('btnClearLog').onclick        = () => { $('terminal-content').innerHTML = ''; };

window.onload = () => {
    applyModeUI('auto'); // Default startup system state
    applyRainUI(false);  // Default starting rain sensor simulation state
    log('smartline roof control system ready — connect firebase & micro:bit 🚀');
};
</script>
</body>
</html>
